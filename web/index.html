<!DOCTYPE html>
<html lang="tr">

      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta
      name="description"
      content="Sutols: Profesyonel sunumlar oluşturun. Anahtar kelime tabanlı, animasyonlu web sunum platformu."
    />
    <meta name="theme-color" content="#4F46E5" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="sutols-symbol-favicon.png" />
    <link rel="apple-touch-icon" href="sutols-symbol-icon-192.png" />
    <title>Sutols – Sunum Platformu</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #fafbfd;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        overflow: hidden;
      }

      /* Flutter loading indicator */
      .loading-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
        gap: 16px;
      }

      .loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e2e8f0;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: spin 0.8s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        font-size: 14px;
        font-weight: 500;
        color: #94a3b8;
        letter-spacing: 0.02em;
      }
    </style>

  <body>
    <div class="loading-container" id="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">Sutols yükleniyor…</div>
    </div>
    <script>
      // Remove loading indicator when Flutter is ready
      window.addEventListener('flutter-first-frame', function () {
        const loader = document.getElementById('loading');
        if (loader) {
          loader.style.transition = 'opacity 0.3s ease';
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 300);
        }
      });

      // Prevent browser default right-click menu so Flutter handles it
      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
