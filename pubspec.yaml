name: sutol
description: Web-first animated presentation MVP for keyword-driven slides.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  firebase_ai: ^3.10.0
  cloud_firestore: ^6.2.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

